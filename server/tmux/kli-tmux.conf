# KLI — tmux configuration matched to ~/.tmux.conf (colour235/236 charcoal + colour51 cyan + colour24 ocean blue)
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s set-clipboard on

# Inactive/active window styles matching ~/.tmux.conf
set -g window-style "fg=colour250,bg=colour236"
set -g window-active-style "fg=colour255,bg=colour235"

# Pane borders — colour24 (ocean blue) inactive, colour51 (electric cyan) active
set -g pane-border-style "fg=colour24,bg=default"
set -g pane-active-border-style "fg=colour51,bg=default"
set -g pane-border-lines simple
set -g pane-border-indicators colour
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=colour16#,bg=colour51#,bold] #{pane_title} #[default],#[fg=colour244] #{pane_title} }"

# Message & copy-mode styling
set -g message-style "bg=colour236,fg=colour255,bold"
set -g message-command-style "bg=colour236,fg=colour51"
set -g mode-style "bg=colour51,fg=colour16,bold"

# Status bar — colour51 cyan + colour24 ocean blue + colour235/236 charcoal
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=colour235,fg=colour250"

set -g status-left-length 48
set -g status-left "#[bg=colour51,fg=colour16,bold] agy #[bg=colour24,fg=colour255,bold] #S #[bg=colour235,fg=colour24] "

set -g status-right-length 72
set -g status-right "#[bg=colour236,fg=colour250] #{b:pane_current_path} #[fg=colour24]│ #[fg=colour51]#{pane_current_command} #[fg=colour24]│ #[fg=colour255]%H:%M "

# Window tabs
setw -g window-status-format "#[fg=colour244] #I:#W "
setw -g window-status-current-format "#[bg=colour24,fg=colour255,bold] #I:#W* "
setw -g window-status-separator ""

# Vi copy-mode & convenient splits
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
