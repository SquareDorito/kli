# KLI Light Mode — crisp daylight counterpart to kli-tmux.conf
set -g window-style "fg=#3b4b58,bg=#f6f9fb"
set -g window-active-style "fg=#172128,bg=#ffffff"

# Pane borders
set -g pane-border-style "fg=#b8cad6,bg=default"
set -g pane-active-border-style "fg=#007ea7,bg=default"
set -g pane-border-format "#{?pane_active,#[fg=#ffffff#,bg=#007ea7#,bold] #{pane_title} #[default],#[fg=#5c6f7e] #{pane_title} }"

# Message & copy-mode styling
set -g message-style "bg=#e6eff5,fg=#172128,bold"
set -g message-command-style "bg=#e6eff5,fg=#005f87"
set -g mode-style "bg=#007ea7,fg=#ffffff,bold"

# Status bar
set -g status-style "bg=#e9f0f5,fg=#3b4b58"
set -g status-left "#[bg=#007ea7,fg=#ffffff,bold] agy #[bg=#005f87,fg=#ffffff,bold] #S #[bg=#e9f0f5,fg=#005f87] "
set -g status-right "#[bg=#dfe8ef,fg=#3b4b58] #{b:pane_current_path} #[fg=#b8cad6]│ #[fg=#005f87]#{pane_current_command} #[fg=#b8cad6]│ #[fg=#172128]%H:%M "

# Window tabs
setw -g window-status-format "#[fg=#5c6f7e] #I:#W "
setw -g window-status-current-format "#[bg=#005f87,fg=#ffffff,bold] #I:#W* "
